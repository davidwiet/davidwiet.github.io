name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.snapshot.outputs.sha }}
      changed: ${{ steps.snapshot.outputs.changed }}
    steps:
      - name: Checkout current publication branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Test public-only mirror contract
        run: python3 -m unittest discover -s tests -v
      - name: Refresh published blog archive
        run: python3 scripts/mirror_blog.py
      - name: Save verified public snapshot
        id: snapshot
        run: |
          git add -- content/blog/posts.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Mirror published Substack articles'
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    runs-on: ubuntu-latest
    needs: mirror
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.mirror.outputs.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify rendered archive
        run: python3 scripts/verify_blog.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
