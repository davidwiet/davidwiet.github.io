name: Preserve Public Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out released version
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Create exact public-source archive
        run: |
          mkdir -p evidence
          git archive --format=tar.gz --prefix=works-in-progress-${{ github.event.release.tag_name }}/ HEAD works_in_progress > evidence/works-in-progress.tar.gz
          cd evidence
          sha512sum works-in-progress.tar.gz > works-in-progress.tar.gz.sha512

      - name: Request and verify RFC 3161 timestamp
        run: |
          openssl ts -query -data evidence/works-in-progress.tar.gz -no_nonce -sha512 -cert -out evidence/freetsa-request.tsq
          curl --fail --retry 3 --retry-delay 5 \
            -H 'Content-Type: application/timestamp-query' \
            --data-binary '@evidence/freetsa-request.tsq' \
            https://freetsa.org/tsr \
            --output evidence/freetsa-response.tsr
          curl --fail --retry 3 --retry-delay 5 https://freetsa.org/files/tsa.crt --output evidence/freetsa-tsa.crt
          curl --fail --retry 3 --retry-delay 5 https://freetsa.org/files/cacert.pem --output evidence/freetsa-ca.pem
          openssl ts -verify \
            -in evidence/freetsa-response.tsr \
            -queryfile evidence/freetsa-request.tsq \
            -CAfile evidence/freetsa-ca.pem \
            -untrusted evidence/freetsa-tsa.crt
          openssl ts -reply -in evidence/freetsa-response.tsr -text > evidence/freetsa-response.txt

      - name: Attach public evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" evidence/* --clobber

      - name: Update article evidence metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
        run: |
          git fetch origin main --tags --force
          git checkout -B main origin/main

          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          previous_tag="$(jq -r --arg tag "$RELEASE_TAG" '
            map(select(.draft == false)) | map(.tag_name) |
            . as $tags | ($tags | index($tag)) as $current |
            if $current == null then "" else .[$current + 1] // "" end
          ' releases.json)"

          if [ -n "$previous_tag" ]; then
            changed_files="$(git diff --name-only "$previous_tag" "$RELEASE_TAG" -- works_in_progress | grep -E '^works_in_progress/[^/]+/current\.md$' || true)"
          else
            changed_files="$(find works_in_progress -mindepth 2 -maxdepth 2 -name current.md | sort)"
          fi

          release_date="$(date -u -d "$RELEASE_DATE" '+%d %B %Y')"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            work_key="${file#works_in_progress/}"
            work_key="${work_key%/current.md}"
            jq --arg key "$work_key" --arg date "$release_date" --arg url "$RELEASE_URL" '
              .[$key] = {
                firstPublished: (.[$key].firstPublished // { date: $date, releaseUrl: $url }),
                lastUpdated: { date: $date, releaseUrl: $url }
              }
            ' src/data/evidence.json > src/data/evidence.json.tmp
            mv src/data/evidence.json.tmp src/data/evidence.json
          done <<< "$changed_files"

          rm releases.json
          if git diff --quiet -- src/data/evidence.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/evidence.json
          git commit -m "Update article timestamp evidence for ${RELEASE_TAG}"
          git push origin HEAD:main
